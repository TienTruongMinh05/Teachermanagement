services:
  - type: web
    name: tkb-thpt-nguyenhue
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    plan: free
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: TZ
        value: "Asia/Ho_Chi_Minh"
      - key: AUTH_ENABLED
        value: "true"
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: ALLOWED_EMAILS
        sync: false
      - key: ALLOWED_DOMAINS
        value: "*"
      - key: SESSION_SECRET
        generateValue: true
